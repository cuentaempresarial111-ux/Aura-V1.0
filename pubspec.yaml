name: aura_mobile_defens
description: "Aura Mobile Defens — software propietario de defensa cibernética de alto riesgo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  crypto: ^3.0.7
  encrypt: ^5.0.3
  local_auth: ^2.3.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model/aura_brain_model.enc

