workflows:
  android-build:
    name: Aura Android Release Pipeline
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - production_keys
      vars:
        PACKAGE_NAME: "com.aura.cyberdefense"
      flutter: stable
      java: 21
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
        - pattern: 'principal'
    scripts:
      - name: Set up local.properties
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          : "${FLUTTER_ROOT:?FLUTTER_ROOT is required}"
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties
      - name: Validar e inyectar variables criptográficas
        script: |
          set -euo pipefail
          echo "Comprobando variables de entorno..."
          if [[ -z "${AURA_PUBLIC_KEY_ENV:-}" ]]; then
            echo "⚠️ ADVERTENCIA: AURA_PUBLIC_KEY_ENV no detectada en el panel. Usando fallback de desarrollo; las actualizaciones firmadas con la clave de producción no se verificarán."
            export AURA_PUBLIC_KEY_ENV=""
          else
            echo "🟢 Variable detectada correctamente desde el panel web."
          fi
          printf 'AURA_PUBLIC_KEY_ENV=%s\n' "$AURA_PUBLIC_KEY_ENV" >> "${CM_ENV:?CM_ENV is required}"
      - name: Build Android APK (Release, signed model updates)
        script: |
          set -euo pipefail
          cd "${CM_BUILD_DIR:?CM_BUILD_DIR is required}"
          flutter clean
          flutter pub get
          flutter build apk --release --dart-define="AURA_PUBLIC_KEY=$AURA_PUBLIC_KEY_ENV"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      
